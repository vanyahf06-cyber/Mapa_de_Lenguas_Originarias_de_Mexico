<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Digital de la Diversidad Lingüística de México</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0A192F', card: '#112240', accent: '#FDCB6E', teal: '#64FFDA', slate: '#8892B0', light: '#E6F1FF' },
                        region: { norte: '#ef4444', centro: '#3b82f6', pacifico: '#10b981', sureste: '#f59e0b' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0A192F;
            color: #E6F1FF;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0A192F;
        }

        ::-webkit-scrollbar-thumb {
            background: #233554;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64FFDA;
        }

        .leaflet-popup-content-wrapper {
            background: #112240 !important;
            color: #E6F1FF !important;
            border: 1px solid #233554;
            border-radius: 12px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            padding: 0;
            width: 340px !important;
        }

        .leaflet-popup-content {
            margin: 12px !important;
            width: auto !important;
        }

        .leaflet-popup-tip {
            background: #112240 !important;
            border: 1px solid #233554;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #8892B0 !important;
            padding: 8px 8px 0 0 !important;
        }

        .leaflet-container a.leaflet-popup-close-button:hover {
            color: #64FFDA !important;
        }

        .leaflet-container {
            background: #0d1b2a !important;
        }

        /* Estilos para los textos enriquecidos en los modales (Evita que Tailwind los borre) */
        .rich-text h2 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #FDCB6E;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #233554;
            padding-bottom: 0.25rem;
        }

        .rich-text h3 {
            font-size: 1.2rem;
            font-weight: bold;
            color: #64FFDA;
            margin-top: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .rich-text p {
            margin-bottom: 0.75rem;
        }

        .rich-text ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .rich-text li {
            margin-bottom: 0.25rem;
        }

        .rich-text a {
            color: #64FFDA;
            text-decoration: underline;
        }
    </style>
</head>

<body class="h-full flex flex-col overflow-hidden bg-brand-dark">

    <!-- Header -->
    <header
        class="bg-brand-card border-b border-gray-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div
                class="w-10 h-10 rounded-xl bg-brand-teal/10 border border-brand-teal/30 flex items-center justify-center text-brand-teal text-xl shadow-lg">
                <i class="fa-solid me-0.5 fa-language"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold text-white tracking-wide flex items-center gap-2">
                    Diversidad Lingüística de México
                    <span
                        class="text-xs bg-brand-teal/20 text-brand-teal border border-brand-teal/30 px-2 py-0.5 rounded-full font-normal">68
                        Lenguas Originarias</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <a href="gestion-lenguas.html"
                class="px-3 py-1.5 rounded-lg bg-gray-500/10 hover:bg-gray-500/20 border border-gray-500/30 text-gray-300 text-xs font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-database"></i><span>Panel de Datos</span>
            </a>
            <button onclick="openCaseStudiesModal()"
                class="px-3 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-star"></i><span>Estudios de Caso</span>
            </button>
            <button onclick="openReflectionModal()"
                class="px-3 py-1.5 rounded-lg bg-brand-teal/10 hover:bg-brand-teal/20 border border-brand-teal/30 text-brand-teal text-xs font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-graduation-cap"></i><span>Reflexión Pedagógica</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
        <!-- Sidebar -->
        <aside
            class="w-full md:w-80 lg:w-96 bg-brand-card/95 backdrop-blur border-r border-gray-800 flex flex-col z-10 shrink-0 h-48 md:h-auto overflow-y-auto">
            <div class="p-3 border-b border-gray-800 space-y-2">
                <div class="relative">
                    <i
                        class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Buscar lengua o variante..."
                        class="w-full bg-brand-dark border border-gray-700 rounded-lg pl-9 pr-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-brand-teal transition">
                </div>
                <div class="grid grid-cols-2 gap-1.5 pt-1">
                    <button onclick="filterRegion('all')"
                        class="region-filter-btn active-filter px-2 py-1 rounded bg-gray-800 text-gray-300 hover:text-white text-[11px] font-medium flex items-center justify-between border border-transparent"
                        data-region="all"><span>Todas</span><span id="countAll"
                            class="text-[10px] opacity-70">0</span></button>
                    <button onclick="filterRegion('Norte')"
                        class="region-filter-btn px-2 py-1 rounded bg-red-950/40 text-red-300 hover:bg-red-900/50 text-[11px] font-medium flex items-center justify-between border border-red-800/40"
                        data-region="Norte"><span class="flex items-center gap-1.5"><span
                                class="w-2 h-2 rounded-full bg-region-norte"></span>Norte</span><span id="countNorte"
                            class="text-[10px] opacity-70">0</span></button>
                    <button onclick="filterRegion('Centro')"
                        class="region-filter-btn px-2 py-1 rounded bg-blue-950/40 text-blue-300 hover:bg-blue-900/50 text-[11px] font-medium flex items-center justify-between border border-blue-800/40"
                        data-region="Centro"><span class="flex items-center gap-1.5"><span
                                class="w-2 h-2 rounded-full bg-region-centro"></span>Centro</span><span id="countCentro"
                            class="text-[10px] opacity-70">0</span></button>
                    <button onclick="filterRegion('Pacífico')"
                        class="region-filter-btn px-2 py-1 rounded bg-emerald-950/40 text-emerald-300 hover:bg-emerald-900/50 text-[11px] font-medium flex items-center justify-between border border-emerald-800/40"
                        data-region="Pacífico"><span class="flex items-center gap-1.5"><span
                                class="w-2 h-2 rounded-full bg-region-pacifico"></span>Pacífico</span><span
                            id="countPacifico" class="text-[10px] opacity-70">0</span></button>
                    <button onclick="filterRegion('Sureste')"
                        class="region-filter-btn px-2 py-1 rounded bg-amber-950/40 text-amber-300 hover:bg-amber-900/50 text-[11px] font-medium flex items-center justify-between border border-amber-800/40 col-span-2"
                        data-region="Sureste"><span class="flex items-center gap-1.5"><span
                                class="w-2 h-2 rounded-full bg-region-sureste"></span>Sureste y Golfo</span><span
                            id="countSureste" class="text-[10px] opacity-70">0</span></button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1" id="languageList"></div>
        </aside>

        <!-- Map -->
        <main class="flex-1 relative h-full min-h-[350px]">
            <div id="map" class="w-full h-full bg-brand-dark"></div>
        </main>
    </div>

    <!-- MODAL Case Studies -->
    <div id="modalCaseStudies"
        class="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div
            class="bg-brand-card border border-amber-500/30 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div
                class="p-4 bg-gradient-to-r from-amber-950/40 to-brand-card border-b border-gray-800 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div
                        class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <h2 class="text-base font-bold text-white">Estudios de Caso</h2>
                </div>
                <button onclick="closeCaseStudiesModal()"
                    class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <!-- Se añade la clase rich-text -->
            <div id="contentCaseStudies"
                class="rich-text p-4 sm:p-6 overflow-y-auto space-y-6 flex-1 text-xs sm:text-sm text-gray-300"></div>
        </div>
    </div>

    <!-- MODAL Reflection -->
    <div id="modalReflection"
        class="fixed inset-0 z-[1000] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div
            class="bg-brand-card border border-brand-teal/30 rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div
                class="p-4 bg-gradient-to-r from-brand-dark to-brand-card border-b border-gray-800 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div
                        class="w-9 h-9 rounded-xl bg-brand-teal/20 border border-brand-teal/40 flex items-center justify-center text-brand-teal">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h2 class="text-base font-bold text-white">Reflexión Pedagógica</h2>
                </div>
                <button onclick="closeReflectionModal()"
                    class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <!-- Se añade la clase rich-text -->
            <div id="contentReflection"
                class="rich-text p-5 sm:p-6 overflow-y-auto space-y-4 text-xs sm:text-sm text-gray-300 leading-relaxed">
            </div>
        </div>
    </div>

    <script>
        let languagesData = JSON.parse(localStorage.getItem('lenguasData')) || [];
        let textsData = JSON.parse(localStorage.getItem('textosData')) || { caseStudies: "", reflection: "" };

        let map;
        let markersLayerGroup;
        let activeRegion = 'all';
        const markersMap = new Map();
        const regionColors = { 'Norte': '#ef4444', 'Centro': '#3b82f6', 'Pacífico': '#10b981', 'Sureste': '#f59e0b' };
        let currentActiveId = null; // Para saber qué marcador volver a la normalidad

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderSidebarList(languagesData);
            setupSearch();
            updateRegionCounts();
            setTimeout(() => { if (map) map.invalidateSize(); }, 500);
        });

        function initMap() {
            map = L.map('map', { zoomControl: true, minZoom: 4, maxZoom: 11 }).setView([23.6345, -102.5528], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap | INALI'
            }).addTo(map);
            markersLayerGroup = L.layerGroup().addTo(map);
            renderMapMarkers(languagesData);
        }

        function renderMapMarkers(data) {
            markersLayerGroup.clearLayers();
            markersMap.clear();

            data.forEach(item => {
                const color = regionColors[item.region] || '#3b82f6';

                // Función auxiliar para crear el icono (normal vs seleccionado)
                const createIcon = (isActive) => L.divIcon({
                    className: 'custom-leaflet-marker',
                    html: `<div class="rounded-full border-2 border-white shadow-lg flex items-center justify-center transition-all duration-300" 
                                style="background-color: ${isActive ? '#8b5cf6' : color}; 
                                       width: ${isActive ? '24px' : '16px'}; 
                                       height: ${isActive ? '24px' : '16px'};
                                       box-shadow: ${isActive ? '0 0 15px #8b5cf6' : '0 4px 6px rgba(0,0,0,0.3)'};">
                           </div>`,
                    iconSize: isActive ? [24, 24] : [16, 16],
                    iconAnchor: isActive ? [12, 12] : [8, 8]
                });

                const marker = L.marker(item.coords, { icon: createIcon(false) });

                const popupHTML = `
                    <div class="p-1 space-y-1.5 max-w-full text-xs">
                        <div class="flex flex-col border-b border-gray-700 pb-1">
                            <div><span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase text-white" style="background-color: ${color}">${item.region}</span></div>
                            <h3 class="text-base font-bold text-white mt-0.5">${item.name}</h3>
                        </div>
                        <div class="space-y-0.5 bg-brand-dark/80 p-2 rounded-lg border border-gray-800 text-[11px] leading-tight">
                            <p class="text-gray-300"><strong class="text-brand-teal">Familia:</strong> ${item.family || '—'}</p>
                            <p class="text-gray-300"><strong class="text-brand-teal">Agrupación:</strong> ${item.group || '—'}</p>
                            <p class="text-gray-300"><strong class="text-brand-teal">Variante:</strong> ${item.variant || '—'}</p>
                        </div>
                        ${renderMediaPlayer(item)}
                    </div>
                `;

                marker.bindPopup(popupHTML, {
                    autoPan: true,
                    autoPanPaddingTopLeft: [20, 120],
                    autoPanPaddingBottomRight: [20, 120],
                    keepInView: true
                });

                // Al abrir, resaltamos el icono
                marker.on('popupopen', () => {
                    if (currentActiveId && markersMap.has(currentActiveId)) {
                        markersMap.get(currentActiveId).setIcon(createIcon(false));
                    }
                    marker.setIcon(createIcon(true));
                    currentActiveId = item.id;
                });

                // Al cerrar, el icono SE QUEDA resaltado (grande y dorado) para ubicarnos
                marker.on('popupclose', () => {
                    // No hacemos nada, dejamos que se quede el icono grande
                });

                marker.addTo(markersLayerGroup);
                markersMap.set(item.id, marker);
            });
        }

        function formatText(text) {
            if (!text) return '';
            return text.replace(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})[^\s<]*/g, (match, videoId) => {
                return `<div class="my-3 rounded-lg overflow-hidden border border-gray-700 bg-black h-56"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
            });
        }

        function renderMediaPlayer(item) {
            const mediaUrl = item.mediaUrl || '';
            const type = item.mediaType || 'external';
            if (type === 'mp4' && mediaUrl) {
                return `<div class="mt-1 rounded-lg overflow-hidden border border-gray-700 bg-black"><video controls preload="metadata" class="w-full h-52 object-contain bg-black"><source src="${mediaUrl}" type="video/mp4"></video></div>`;
            }
            if (type === 'youtube' || (item.audioUrl && item.audioUrl.includes('youtu'))) {
                const videoId = extractYouTubeId(item.audioUrl);
                if (videoId) return `<div class="mt-1 rounded-lg overflow-hidden border border-gray-700 bg-black h-52"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
            }
            return `<div class="mt-1"><a href="${item.audioUrl}" target="_blank" class="w-full px-3 py-2 rounded-lg bg-brand-teal text-brand-dark font-bold text-[11px] flex items-center justify-center gap-1.5 hover:bg-teal-300 transition shadow"><i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir Link Externo</a></div>`;
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            return match ? match[1] : null;
        }

        // ============================================
        // MODALES: VACIAR HTML PARA DETENER VIDEOS
        // ============================================
        function openCaseStudiesModal() {
            document.getElementById('contentCaseStudies').innerHTML = formatText(textsData.caseStudies);
            document.getElementById('modalCaseStudies').classList.remove('hidden');
        }
        function closeCaseStudiesModal() {
            document.getElementById('modalCaseStudies').classList.add('hidden');
            document.getElementById('contentCaseStudies').innerHTML = ''; // Detiene el video
        }

        function openReflectionModal() {
            document.getElementById('contentReflection').innerHTML = formatText(textsData.reflection);
            document.getElementById('modalReflection').classList.remove('hidden');
        }
        function closeReflectionModal() {
            document.getElementById('modalReflection').classList.add('hidden');
            document.getElementById('contentReflection').innerHTML = ''; // Detiene el video
        }

        function renderSidebarList(data) {
            const container = document.getElementById('languageList');
            container.innerHTML = '';
            data.forEach(item => {
                const color = regionColors[item.region] || '#3b82f6';
                const card = document.createElement('div');
                card.className = "p-2.5 rounded-xl bg-brand-dark/40 hover:bg-brand-dark border border-gray-800/80 cursor-pointer flex items-center justify-between group";
                card.onclick = () => {
                    map.flyTo(item.coords, 7, { duration: 1.5 });
                    const marker = markersMap.get(item.id);
                    if (marker) setTimeout(() => marker.openPopup(), 1500);
                };
                card.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${color}"></span>
                        <div>
                            <h4 class="text-xs font-semibold text-white group-hover:text-brand-teal">${item.name}</h4>
                            <p class="text-[10px] text-brand-slate">${item.family}</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-600"></i>
                `;
                container.appendChild(card);
            });
        }

        function updateRegionCounts() {
            document.getElementById('countAll').textContent = languagesData.length;
            document.getElementById('countNorte').textContent = languagesData.filter(i => i.region === 'Norte').length;
            document.getElementById('countCentro').textContent = languagesData.filter(i => i.region === 'Centro').length;
            document.getElementById('countPacifico').textContent = languagesData.filter(i => i.region === 'Pacífico').length;
            document.getElementById('countSureste').textContent = languagesData.filter(i => i.region === 'Sureste').length;
        }

        function filterRegion(region) {
            activeRegion = region;
            document.querySelectorAll('.region-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-region') === region) btn.classList.add('border-white', 'font-bold');
                else btn.classList.remove('border-white', 'font-bold');
            });
            applyFilters();
        }

        function setupSearch() { document.getElementById('searchInput').addEventListener('input', applyFilters); }

        function applyFilters() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = languagesData.filter(item => {
                const matchReg = (activeRegion === 'all' || item.region === activeRegion);
                const matchTxt = item.name.toLowerCase().includes(term) || item.family.toLowerCase().includes(term);
                return matchReg && matchTxt;
            });
            renderSidebarList(filtered);
            renderMapMarkers(filtered);
        }

        function resetMapFocus() {
            map.flyTo([23.6345, -102.5528], 5, { duration: 1 });
            filterRegion('all');
            document.getElementById('searchInput').value = '';
            if (currentActiveId && markersMap.has(currentActiveId)) {
                // Volver al color original (esto requiere recrear el icono, pero para simplificar, recargamos los marcadores)
                renderMapMarkers(languagesData);
                currentActiveId = null;
            }
        }
    </script>
</body>

</html>
